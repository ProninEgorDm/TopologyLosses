name: dice_pooling
seed: 42
data:
  dataset_path: null
  image_size: 256
  batch_size: 2
  num_workers: 0
  test_size: 0.2
  holdout_test_fraction: 0.4
  split_file: splits/vessmap_seed42.json
  annotator: annotator1
model:
  name: transunet
  in_channels: 1
  out_channels: 128
  head_num: 4
  mlp_dim: 256
  block_num: 4
  patch_dim: 16
  class_num: 1
train:
  epochs: 100
  learning_rate: 0.0003
  weight_decay: 0.0001
  device: cpu
  metric_threshold: 0.5
loss:
  terms:
    - name: dice
      weight: 1.0
    - name: pooling
      # Доля занятых окон после max-pool уже лежит в [0, 1].
      weight: 1.0
