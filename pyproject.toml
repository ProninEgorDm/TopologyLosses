[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "topologysegmentation"
dynamic = ["version"]
description = "Losses and metrics for topology-aware image segmentation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT AND Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
    "src/topologysegmentation/losses/vendor/tloss/LICENSE",
]
authors = [{ name = "proninegor", email = "pr0n1n3@yandex.ru" }]
keywords = ["segmentation", "topology", "persistent-homology", "pytorch", "loss"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.2",
    "sphinx>=9.1.1",
    "sphinx-rtd-theme>=3.1.0",
    "torch>=2.2",
]

# ph: лоссы и метрики на кубической гомологии (hu, bm, sat, числа Бетти).
# plot: графики Betti matching. Сам лосс bm их не импортирует.
[project.optional-dependencies]
ph = [
    "gudhi>=3.13.0",
    "pot>=0.9.7.post1",
    "torch-topological>=0.1.9",
]
plot = [
    "panel>=1.8.10",
]
all = [
    "gudhi>=3.13.0",
    "pot>=0.9.7.post1",
    "torch-topological>=0.1.9",
    "panel>=1.8.10",
]

[project.urls]
Homepage = "https://github.com/ProninEgorDm/TopologyLosses"
Repository = "https://github.com/ProninEgorDm/TopologyLosses"
Issues = "https://github.com/ProninEgorDm/TopologyLosses/issues"
PyPI = "https://pypi.org/project/topologysegmentation"

# Версия пакета — одна строка в src/topologysegmentation/VERSION.
# Файл читается при сборке без импорта torch.
[tool.setuptools.dynamic]
version = { file = "src/topologysegmentation/VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["topologysegmentation*"]
# У GDLoss в файле нет лицензии, в колесо он не входит.
exclude = ["topologysegmentation.losses.vendor.gd*"]

[tool.setuptools.package-data]
topologysegmentation = ["VERSION", "losses/vendor/tloss/LICENSE", "_native/*.c"]

# Локальный репозиторий: uv sync ставит эту группу вместе с пакетом.
# В колесо PyPI она не попадает.
[dependency-groups]
dev = [
    "einops>=0.8.2",
    "gudhi>=3.13.0",
    "ipykernel>=7.2.0",
    "monai>=1.5.2",
    "opencv-python>=4.13.0.92",
    "panel>=1.8.10",
    "pixi>=1.0.1",
    "pot>=0.9.7.post1",
    "pyyaml>=6.0.3",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "tensorboard>=2.20.0",
    "thop>=0.1.1",
    "tifffile>=2025.5.10",
    "torch-topological>=0.1.9",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
]

[tool.uv]
default-groups = ["dev"]
